# Page: navigation
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: navigation
label: Navigation
icon: vehicle
order: 3
remote_configurable: true
description: Map, route context, smart cruise, and speed-limit controls
sections:
- id: map_context
  title: Map Context
  description: Local map data and route context shown by sunnypilot.
  items:
  - key: RoadNameToggle
    widget: toggle
    title: Map Road Names
    description: Show available mapd/OSM road-name context in the driving UI.
  - key: OsmLocal
    widget: toggle
    title: Use Local OSM Data
    description: Prefer downloaded local OSM map data when available for map context and speed-limit sources.
  - key: MapdVersion
    widget: info
    blocked: true
    title: mapd Version
  - key: OsmLocationName
    widget: info
    blocked: true
    title: OSM Area
  - key: MapSpeedLimit
    widget: info
    blocked: true
    title: Map Speed Limit
  - key: NextMapSpeedLimit
    widget: info
    blocked: true
    title: Next Map Speed Limit
- id: smart_cruise
  title: Smart Cruise
  description: Map and vision inputs used for smoother curve speed behavior when cruise support is available.
  items:
  - key: SmartCruiseControlMap
    widget: toggle
    title: Smart Cruise - Map
    description: Use map context to estimate appropriate speed for turns and road geometry.
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
  - key: SmartCruiseControlVision
    widget: toggle
    title: Smart Cruise - Vision
    description: Use vision path predictions to estimate appropriate speed for curves ahead.
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
- id: speed_limits
  title: Speed Limits
  description: Speed-limit display, source, and offset behavior.
  items:
  - key: SpeedLimitMode
    widget: multiple_button
    title: Speed Limit Assist
    description: Controls speed-limit display, warning, and assisted cruise-speed adjustment where supported.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Info
    - value: 2
      label: Warning
    - value: 3
      label: Assist
      enablement:
      - type: any
        conditions:
        - type: capability
          field: has_longitudinal_control
          equals: true
        - type: capability
          field: has_icbm
          equals: true
      - type: not
        condition:
          type: capability
          field: brand
          equals: rivian
      - type: not
        condition:
          type: all
          conditions:
          - type: capability
            field: brand
            equals: tesla
          - type: capability
            field: is_sp_release
            equals: true
  - key: SpeedLimitPolicy
    widget: multiple_button
    title: Speed Limit Source
    description: Choose whether speed limits prefer car state, map data, or a combined priority source.
    options:
    - value: 0
      label: Car
    - value: 1
      label: Map
    - value: 2
      label: Car First
    - value: 3
      label: Map First
    - value: 4
      label: Combined
  - key: SpeedLimitOffsetType
    widget: multiple_button
    title: Speed Limit Offset Type
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Fixed
    - value: 2
      label: Percent
  - key: SpeedLimitValueOffset
    widget: option
    title: Speed Limit Offset Value
    min: -30
    max: 30
    step: 1
    unit:
      metric: km/h
      imperial: mph
    visibility:
    - type: param_compare
      key: SpeedLimitOffsetType
      op: '>'
      value: 0
