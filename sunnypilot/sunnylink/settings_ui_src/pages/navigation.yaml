# Page: navigation
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: navigation
label: Navigation
icon: vehicle
order: 8
remote_configurable: true
description: Route display, car-screen destination sync, and navigation status
sections:
- id: route_control
  title: Route Control
  description: Destination and route-display settings used by the comma UI.
  items:
  - key: Xrm10NavSource
    widget: multiple_button
    title: Navigation Source
    description: Select where the comma route display reads navigation intent from.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Car Screen
    - value: 2
      label: OSM
  - key: Xrm10CarScreenRouteIntent
    widget: toggle
    title: Use Car-Screen Destination
    description: Accept route intent from the car screen when a destination is available.
  - key: Xrm10NavAutoStart
    widget: toggle
    title: Auto-Start Route Display
    description: Turn on route display automatically when a destination appears.
  - key: Xrm10NavActive
    widget: toggle
    title: Active Route Display
    description: Show the active route status on the comma UI. This does not command steering, braking, throttle, or lane changes.
- id: traffic_light_advisory
  title: Road Advisories
  description: Experimental Mode only. Advisory channels for route, sign, and road-object review.
  items:
  - key: Xrm10TrafficLightAdvisory
    widget: toggle
    title: Traffic Light Advisory
    description: Experimental Mode only. Enable a traffic-light advisory channel for detector and replay review. This does
      not directly command stop/go braking.
    enablement:
    - type: param
      key: ExperimentalMode
      equals: true
  - key: Xrm10SpeedBumpAdvisory
    widget: toggle
    title: Speed Bump Advisory
    description: Experimental Mode only. Enable a speed-bump advisory channel for route and replay review. This does not
      directly command braking.
    enablement:
    - type: param
      key: ExperimentalMode
      equals: true
  - key: Xrm10StopYieldAdvisory
    widget: toggle
    title: Stop/Yield Advisory
    description: Experimental Mode only. Log and show stop-sign and yield scenarios for replay review.
    enablement:
    - type: param
      key: ExperimentalMode
      equals: true
  - key: Xrm10RoundaboutAdvisory
    widget: toggle
    title: Roundabout Advisory
    description: Experimental Mode only. Log roundabout entry, yield, and exit situations for review.
    enablement:
    - type: param
      key: ExperimentalMode
      equals: true
  - key: Xrm10MergeAdvisory
    widget: toggle
    title: Merge/Yield Advisory
    description: Experimental Mode only. Log ramp, merge, and give-way situations for review.
    enablement:
    - type: param
      key: ExperimentalMode
      equals: true
  - key: Xrm10CrossTrafficAdvisory
    widget: toggle
    title: Cross Traffic Advisory
    description: Experimental Mode only. Log side-traffic situations around exits, junctions, and roundabouts.
    enablement:
    - type: param
      key: ExperimentalMode
      equals: true
- id: lane_traffic_advisory
  title: Lane and Traffic Advisories
  description: Experimental Mode only. Lane and traffic-flow suggestions remain review/confirmation signals.
  items:
  - key: Xrm10LaneSuggestionAdvisory
    widget: toggle
    title: Lane Suggestions
    description: Experimental Mode only. Show lane-change suggestions for review without directly commanding a maneuver.
    enablement:
    - type: param
      key: ExperimentalMode
      equals: true
  - key: Xrm10FasterLaneSuggestion
    widget: toggle
    title: Faster Lane Suggestion
    description: Experimental Mode only. Suggest a faster lane when available; action still requires a validated planner path.
    enablement:
    - type: param
      key: ExperimentalMode
      equals: true
  - key: Xrm10CurveSlowdownAdvisory
    widget: toggle
    title: Curve Slowdown Advisory
    description: Experimental Mode only. Log curve-speed slowdown opportunities for replay review.
    enablement:
    - type: param
      key: ExperimentalMode
      equals: true
  - key: Xrm10ZoneCautionAdvisory
    widget: toggle
    title: Zone Caution Advisory
    description: Experimental Mode only. Log school-zone and construction-zone caution situations for review.
    enablement:
    - type: param
      key: ExperimentalMode
      equals: true
  - key: Xrm10LeadCarMovedAdvisory
    widget: toggle
    title: Lead Car Moved Advisory
    description: Experimental Mode only. Log lead-car movement and traffic-flow restart scenarios.
    enablement:
    - type: param
      key: ExperimentalMode
      equals: true
- id: experimental_logging
  title: Experimental Logging
  description: Experimental Mode only. Capture evidence for replay before road behavior changes are implemented.
  items:
  - key: Xrm10ExperimentalEventRecorder
    widget: toggle
    title: Experimental Event Recorder
    description: Experimental Mode only. Save route, model, speed, and camera context around assist events.
    enablement:
    - type: param
      key: ExperimentalMode
      equals: true
  - key: Xrm10ReplayLogging
    widget: toggle
    title: Replay Logging
    description: Experimental Mode only. Keep replay-ready evidence for offline validation.
    enablement:
    - type: param
      key: ExperimentalMode
      equals: true
- id: planner_preview
  title: Planner Preview
  description: Read-only preview values written by an experimental planner or replay tool.
  items:
  - key: Xrm10PlannerNextAction
    widget: info
    blocked: true
    title: Next Action
  - key: Xrm10PlannerActionDistance
    widget: info
    blocked: true
    title: Action Distance
  - key: Xrm10PlannerConfidence
    widget: info
    blocked: true
    title: Route Confidence
  - key: Xrm10PlannerReason
    widget: info
    blocked: true
    title: Reason
- id: route_status
  title: Route Status
  description: Read-only live values written by the device or route bridge.
  items:
  - key: Xrm10CarScreenRouteStatus
    widget: info
    blocked: true
    title: Route Status
  - key: Xrm10CarScreenDestination
    widget: info
    blocked: true
    title: Destination
  - key: Xrm10RouteSource
    widget: info
    blocked: true
    title: Active Route Source
  - key: Xrm10RouteLatitude
    widget: info
    blocked: true
    title: Route Latitude
  - key: Xrm10RouteLongitude
    widget: info
    blocked: true
    title: Route Longitude
  - key: Xrm10RouteGoogleMapsUrl
    widget: info
    blocked: true
    title: Maps Link
  - key: Xrm10CarScreenRouteUpdatedAt
    widget: info
    blocked: true
    title: Last Route Update
- id: review_status
  title: Review Status
  description: Evidence and review status used for manual improvement work.
  items:
  - key: Xrm10CodexReviewLoop
    widget: toggle
    title: Keep Review Loop Enabled
    description: Keep log packaging and review status active for future manual review.
  - key: Xrm10CodexAutoDecode
    widget: toggle
    title: Decode Evidence Automatically
    description: Decode collected evidence for review without applying code changes automatically.
  - key: Xrm10CodexAutoApplyAllowed
    widget: info
    blocked: true
    title: Automatic Code Apply
    description: Locked off. Code changes still require manual review and deployment.
  - key: Xrm10CodexPackageStatus
    widget: info
    blocked: true
    title: Review Package Status
  - key: Xrm10SmartAppStatus
    widget: info
    blocked: true
    title: Review Engine Status
  - key: Xrm10SmartScore
    widget: info
    blocked: true
    title: Readiness Score
  - key: Xrm10SmartGate
    widget: info
    blocked: true
    title: Safety Gate
  - key: Xrm10SmartSummary
    widget: info
    blocked: true
    title: Review Summary
  - key: Xrm10SmartNextStep
    widget: info
    blocked: true
    title: Next Step
  - key: Xrm10SmartLastReviewAt
    widget: info
    blocked: true
    title: Last Review
